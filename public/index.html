<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3D FPS Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #instructions {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-family: monospace; font-size: 20px;
            text-align: center; cursor: pointer; background: rgba(0,0,0,0.8);
            padding: 20px; border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>Click to Play FPS</h2>
        <p>W, A, S, D to Move | MOUSE to Look | CLICK to Shoot</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
